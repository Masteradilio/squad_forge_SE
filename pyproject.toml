[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localforge-os"
version = "6.2.0"
description = "Economy-aware control plane for auditable software-engineering agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adilio Farias" }]
keywords = ["ai-agents", "software-engineering", "local-models", "llm", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "SQLAlchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.29,<1.0",
  "psycopg2-binary>=2.9,<3.0",
  "redis>=5.0.0,<6.0",
  "python-dotenv>=1.0,<2.0",
  "GitPython>=3.1,<4.0",
  "pillow>=10.0,<13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-PyYAML>=6.0,<7.0",
  "pre-commit>=3.8,<4.0",
  "build>=1.2,<2.0",
]

[project.scripts]
localforge = "localforge.cli.main:app"

[project.urls]
Repository = "https://github.com/Masteradilio/local_forge_os"
Issues = "https://github.com/Masteradilio/local_forge_os/issues"

[tool.setuptools.packages.find]
where = ["backend"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [
  ".venv",
  "frontend/node_modules",
  ".localforge",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
warn_unused_configs = true
ignore_missing_imports = true
