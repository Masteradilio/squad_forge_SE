services:
  # 1. OmniRoute AI Gateway Proxy (Node.js 22 - 290+ Free Tier LLMs)
  omniroute:
    build:
      context: .
      dockerfile: Dockerfile.omniroute
    container_name: forgeos-omniroute
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      - PORT=20128
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/home/node/.omniroute
      # Bound upstream stalls and cool down failed providers before the next
      # ForgeOS route probe. ForgeOS still consumes OmniRoute exclusively.
      - FETCH_TIMEOUT_MS=${OMNIROUTE_FETCH_TIMEOUT_MS:-60000}
      - FETCH_HEADERS_TIMEOUT_MS=${OMNIROUTE_FETCH_HEADERS_TIMEOUT_MS:-30000}
      - FETCH_BODY_TIMEOUT_MS=${OMNIROUTE_FETCH_BODY_TIMEOUT_MS:-60000}
      - FETCH_CONNECT_TIMEOUT_MS=${OMNIROUTE_FETCH_CONNECT_TIMEOUT_MS:-10000}
      - PROVIDER_COOLDOWN_ENABLED=${OMNIROUTE_PROVIDER_COOLDOWN_ENABLED:-true}
      - PROVIDER_COOLDOWN_MIN_MS=${OMNIROUTE_PROVIDER_COOLDOWN_MIN_MS:-5000}
      - PROVIDER_COOLDOWN_MAX_MS=${OMNIROUTE_PROVIDER_COOLDOWN_MAX_MS:-60000}
    volumes:
      - omniroute-data:/home/node/.omniroute
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:20128/v1/models"]
      interval: 5s
      timeout: 5s
      retries: 3

  # 2. PostgreSQL + Pgvector Vector Database & Persistence
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeos-postgres
    environment:
      - POSTGRES_DB=forgeos
      - POSTGRES_USER=forgeos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeos -d forgeos"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Redis In-Memory Data Store (Sub-millisecond AST Cache & Pub/Sub Events)
  redis:
    image: redis:7-alpine
    container_name: forgeos-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. ForgeOS Backend (Python 3.11 / FastAPI / Playwright / Squad Engine)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: forgeos-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://forgeos:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/forgeos
      - LOCALFORGE_DATABASE_URL=postgresql+asyncpg://forgeos:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/forgeos
      - LOCALFORGE_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - LOCALFORGE_MODEL_BASE_URL=http://omniroute:20128/v1
      - LOCALFORGE_MODEL_PROVIDER=omniroute
      - LOCALFORGE_DEFAULT_MODEL=${LOCALFORGE_DEFAULT_MODEL:-auto/best-free}
      - LOCALFORGE_FALLBACK_MODELS=${LOCALFORGE_FALLBACK_MODELS:-auto/best-free,auto/coding:free}
      - LOCALFORGE_CHIEF_PROVIDER=omniroute
      - LOCALFORGE_CHIEF_BASE_URL=http://omniroute:20128/v1
      - LOCALFORGE_CHIEF_MODEL=${LOCALFORGE_CHIEF_MODEL:-auto/best-free}
      - LOCALFORGE_CHIEF_VISUAL_MODEL=${LOCALFORGE_CHIEF_VISUAL_MODEL:-auto/best-free}
      - LOCALFORGE_CHIEF_FALLBACK_MODELS=${LOCALFORGE_CHIEF_FALLBACK_MODELS:-auto/best-free,auto/coding:free}
      - LOCALFORGE_CHIEF_MAX_ACTIVE_MODEL_CALLS=${LOCALFORGE_CHIEF_MAX_ACTIVE_MODEL_CALLS:-16}
      - LOCALFORGE_VISUAL_MAX_ACTIVE_MODEL_CALLS=${LOCALFORGE_VISUAL_MAX_ACTIVE_MODEL_CALLS:-96}
      - LOCALFORGE_CHIEF_VISUAL_FALLBACK_MODELS=${LOCALFORGE_CHIEF_VISUAL_FALLBACK_MODELS:-auto/best-free,auto/coding:free}
      - LOCALFORGE_CHIEF_API_KEY=${OMNIROUTE_API_KEY:-}
      - OMNIROUTE_URL=http://omniroute:20128/v1
      - LOCALFORGE_OMNIROUTE_JSON_VERIFIED=true
      - LOCALFORGE_OMNIROUTE_MAX_OUTPUT_TOKENS=${LOCALFORGE_OMNIROUTE_MAX_OUTPUT_TOKENS:-6000}
      - LOCALFORGE_OMNIROUTE_REASONING_EFFORT=${LOCALFORGE_OMNIROUTE_REASONING_EFFORT:-none}
      - LOCALFORGE_OMNIROUTE_REQUEST_TIMEOUT=${LOCALFORGE_OMNIROUTE_REQUEST_TIMEOUT:-180}
      - LOCALFORGE_OMNIROUTE_COMBO_MUTATION_ENABLED=${LOCALFORGE_OMNIROUTE_COMBO_MUTATION_ENABLED:-false}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - LOCALFORGE_ENV=production
      - FORGEOS_ENV=production
      - LOCALFORGE_ALLOWED_ORIGINS=${LOCALFORGE_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      - LOCALFORGE_API_TOKEN=${LOCALFORGE_API_TOKEN:?LOCALFORGE_API_TOKEN must be set}
      - LOCALFORGE_SANDBOX_TYPE=docker
      - LOCALFORGE_PROJECTS_ROOT=/var/lib/forgeos/projects
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./backend:/app/backend
      - ./.localforge:/app/.localforge
      - forgeos-projects:/var/lib/forgeos/projects
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    restart: unless-stopped

  # 4. ForgeOS Frontend (Nginx / React 19 Web App)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: forgeos-frontend
    ports:
      - "80:80"
      - "5173:80"
    environment:
      - LOCALFORGE_API_TOKEN=${LOCALFORGE_API_TOKEN:?LOCALFORGE_API_TOKEN must be set}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  omniroute-data:
  forgeos-projects:
