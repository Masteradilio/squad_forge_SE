{{- $deploymentEvidence := .Values.deploymentEvidence | default (dict) -}}
{{- $evidenceSchema := $deploymentEvidence.schema | default "disabled" -}}
{{- $evidencePath := $deploymentEvidence.path | default "/tmp/forgeos-evidence" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "forgeos-cloud.fullname" . }}-config
data:
  FORGEOS_ENV: "{{ .Values.backend.env.FORGEOS_ENV }}"
  FORGEOS_SEMANTIC_CACHE_ENABLED: "{{ .Values.backend.env.FORGEOS_SEMANTIC_CACHE_ENABLED }}"
  FORGEOS_CACHE_SIMILARITY_THRESHOLD: "{{ .Values.backend.env.FORGEOS_CACHE_SIMILARITY_THRESHOLD }}"
  FORGEOS_CACHE_TTL_SECONDS: "{{ .Values.backend.env.FORGEOS_CACHE_TTL_SECONDS }}"
  OMNIROUTE_URL: "http://{{ include "forgeos-cloud.fullname" . }}-omniroute:{{ .Values.omniroute.port }}/v1"
  POSTGRES_HOST: "{{ include "forgeos-cloud.fullname" . }}-postgres"
  POSTGRES_PORT: "{{ .Values.postgres.port }}"
  POSTGRES_DB: "{{ .Values.postgres.database }}"
  POSTGRES_USER: "{{ .Values.postgres.username }}"
  REDIS_HOST: "{{ include "forgeos-cloud.fullname" . }}-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  FORGEOS_EVIDENCE_SCHEMA: {{ $evidenceSchema | quote }}
  FORGEOS_EVIDENCE_PATH: {{ $evidencePath | quote }}
