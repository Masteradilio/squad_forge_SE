apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgeos-cloud.fullname" . }}-backend
  labels:
    {{- include "forgeos-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
  selector:
    app.kubernetes.io/component: backend
