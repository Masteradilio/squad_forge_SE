{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forgeos-cloud.fullname" . }}-observer
  labels:
    {{- include "forgeos-cloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forgeos-cloud.fullname" . }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "forgeos-cloud.serviceAccountName" . }}
{{- end }}
