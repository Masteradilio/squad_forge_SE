apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "forgeos-cloud.fullname" . }}-config
data:
  FORGEOS_ENV: "{{ .Values.backend.env.FORGEOS_ENV }}"
  FORGEOS_SEMANTIC_CACHE_ENABLED: "{{ .Values.backend.env.FORGEOS_SEMANTIC_CACHE_ENABLED }}"
  FORGEOS_CACHE_SIMILARITY_THRESHOLD: "{{ .Values.backend.env.FORGEOS_CACHE_SIMILARITY_THRESHOLD }}"
  FORGEOS_CACHE_TTL_SECONDS: "{{ .Values.backend.env.FORGEOS_CACHE_TTL_SECONDS }}"
  OMNIROUTE_URL: "http://{{ include "forgeos-cloud.fullname" . }}-omniroute:{{ .Values.omniroute.port }}/v1"
