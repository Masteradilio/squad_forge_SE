# Default values for forgeos-cloud Helm Chart.

global:
  environment: production
  domain: cloud.localforge.ai

omniroute:
  replicaCount: 2
  image:
    repository: localforge/omniroute-gateway
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 20128
  resources:
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

backend:
  replicaCount: 3
  image:
    repository: localforge/forgeos-backend
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 8000
  env:
    FORGEOS_ENV: "production"
    FORGEOS_SEMANTIC_CACHE_ENABLED: "true"
    FORGEOS_CACHE_SIMILARITY_THRESHOLD: "0.92"
    FORGEOS_CACHE_TTL_SECONDS: "86400"
  resources:
    limits:
      cpu: "2000m"
      memory: "2048Mi"
    requests:
      cpu: "500m"
      memory: "512Mi"

frontend:
  replicaCount: 2
  image:
    repository: localforge/forgeos-frontend
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 80
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

postgres:
  image:
    repository: pgvector/pgvector
    tag: pg16
  port: 5432
  persistence:
    size: 20Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
