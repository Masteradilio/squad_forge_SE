[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "frontend/node_modules",
  ".localforge",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
warn_unused_configs = true
ignore_missing_imports = true
