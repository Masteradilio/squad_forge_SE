apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forgeos-cloud.fullname" . }}-default-deny
  labels:
    {{- include "forgeos-cloud.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.omniroute.port }}
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migrations
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: omniroute
      ports:
        - protocol: TCP
          port: {{ .Values.omniroute.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
