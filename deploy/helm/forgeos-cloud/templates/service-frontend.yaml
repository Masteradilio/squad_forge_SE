apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgeos-cloud.fullname" . }}-frontend
  labels:
    {{- include "forgeos-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.frontend.port }}
  selector:
    app.kubernetes.io/component: frontend
