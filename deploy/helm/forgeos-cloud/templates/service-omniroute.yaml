apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgeos-cloud.fullname" . }}-omniroute
  labels:
    {{- include "forgeos-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: omniroute
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.omniroute.port }}
      targetPort: {{ .Values.omniroute.port }}
  selector:
    app.kubernetes.io/component: omniroute
